[workspace]
resolver = "2"
members = [
    "crates/reactor-core",
    "crates/reactor-cli",
    "gui/crates/reactor-rpc",
    "gui/crates/reactor-client",
    "gui/crates/reactor-gui",
]
# reactor-gui pulls in a native windowing stack (fontconfig, xkbcommon, ...), so
# a bare `cargo build` / `cargo test` leaves it out. `-p reactor-gui` opts in.
default-members = [
    "crates/reactor-core",
    "crates/reactor-cli",
    "gui/crates/reactor-rpc",
    "gui/crates/reactor-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }
regex = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
