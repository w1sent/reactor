[package]
name = "reactor-agent"
description = "REactor's agent: the session store, the loop over rig, the context budget manager, tools."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reactor-core = { path = "../reactor-core" }
reactor-context = { path = "../reactor-context" }
reactor-db = { path = "../reactor-db" }
rig-core = "0.42"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "io-std", "fs", "signal"] }
tokio-util = "0.7"
futures = "0.3"
regex.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
reactor-db = { path = "../reactor-db" }
serde_json = { workspace = true, features = ["preserve_order"] }
