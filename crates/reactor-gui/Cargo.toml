[package]
name = "reactor-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "reactor-gui — the native REactor frontend (gui/SPEC.md)"

[lib]
name = "reactor_gui"
path = "src/lib.rs"

[[bin]]
name = "reactor-gui"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-languages"] }
reactor-client = { path = "../reactor-client" }
reactor-agent = { path = "../reactor-agent" }
reactor-context = { path = "../reactor-context" }
reactor-core = { path = "../reactor-core" }
reactor-fs = { path = "../reactor-fs" }
reactor-db = { path = "../reactor-db" }
reactor-ingest = { path = "../reactor-ingest" }
# The agent is async (rig is); it runs on its own runtime on background threads,
# never on gpui's executor (docs/adr/0042).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
portable-pty = "0.9.0"
# Decodes the window icon (assets/icon.ico), which gpui takes as RGBA pixels.
csv = "1"
# Reads XML property lists in the data viewer.
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[build-dependencies]
winresource = "0.1"

# What `cargo bundle` reads to make the macOS .app.
[package.metadata.bundle]
name = "REactor"
identifier = "io.github.w1sent.reactor"
icon = ["../../assets/icon.icns"]

[dev-dependencies]
tempfile = "3"
# The same single SQLite binding reactor-db brings in; here only to make a database to open.
rusqlite = { version = "0.40", features = ["bundled"] }

# Linux: the desktop portal's "Open With" chooser needs a file descriptor handed over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
