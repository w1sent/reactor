[package]
name = "reactor-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REactor's context documents: converting files and pages to Markdown, and chunking them"

[dependencies]
htmd = "0.5.5"
pdf-extract = "0.12.1"
pulldown-cmark = "0.13.4"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
scraper = "0.27.0"
text-splitter = { version = "0.33.0", features = ["markdown"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
