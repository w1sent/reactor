# REactor tool catalogue — SHIPPED COPY / SEED
#
# This file is copied to ~/.pi/reactor/tools.toml at install time and the
# installed copy is what everything reads at runtime. Do not edit this one on a
# user machine: pi's package update path runs `git clean -fdx` and will destroy
# your changes. See docs/adr/0003-tools-toml-single-source-of-truth.md.
#
# When this file changes upstream, `reactor diff-config` shows the difference
# against your installed copy; merge by hand.
# See docs/adr/0004-config-updates-via-plain-diff.md.
#
# STATUS: starter set. Deliberately covers every schema path — a service tool, a
# python library, a plain binary, tools with and without upstream skills, and
# tools that are absent from most machines — so both the present and
# missing code paths get exercised. The full target surface is listed in
# docs/concept.md; the catalogue grows as real analysis needs it.
#
# Every `[tool.*.install]` recipe below has been checked against its manager's
# package index — `scripts/verify-recipes.py`, which fails if a recipe names a
# package that does not exist. Re-run it when you touch an install table.

version = 1


# ---------------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------------
#
# [tool.<id>]
#   name    Human-readable name.
#   desc    ONE LINE, written for a model deciding whether to reach for this
#           tool. Appears in every system prompt for as long as the tool is
#           installed and active — the highest-leverage text in the project.
#           Keep it short; describe capability, not usage.
#   invoke  What the agent types to use it. Shown in the registry.
#   detect  How to tell whether it is here. One of:
#             binary        = "rg"          → shutil.which
#             python_module = "lief"        → importlib.util.find_spec, in the
#                                             interpreter named by [probe].python
#   version Optional argv whose stdout carries a version string.
#   source  Optional but shipped-mandatory: the tool's true upstream as one
#           https:// URL — canonical repo over product site. Provenance for
#           the manual install paths; shown by `reactor tools show`.
#           See docs/adr/0028-every-tool-declares-its-source.md.
#   tags    Free-form; toolsets select on these as well as on ids.
#   service Optional. The tool talks to something that may or may not be
#           running: { probe = [argv], label = "…" }. Exit 0 is up, anything
#           else is down, a timeout is unknown. Service probes are the only
#           ones re-run on a timer.
#           An optional { count = { pattern = 'regex', noun = "device" } }
#           reports how many probe output lines match. That is the ONLY detail
#           the registry ever carries, because a count changes when the count
#           changes — free-text output would rewrite the system prompt every
#           time a service jittered. See ADR-0006.
#   skill   Optional upstream Agent Skill to fetch at install time:
#             { source = "git+URL", path = "subdir", ref = "main" }
#           A configured-but-unfetchable skill warns. No skill is normal.
#
# [tool.<id>.install]
#   Keys name PACKAGE MANAGERS, not distributions. A key declared in
#   [platform.manager] below whose binary is on PATH is a candidate; candidates
#   are ranked by [platform].prefer. Any other key — `manual`, a bare URL — is a
#   note: always shown, never selected, never executed. The one exception is
#   `manual-install-oneliner`: a runnable shell one-liner for the manual path,
#   executed only when --auto-install-manual (fallback, no manager recipe ran)
#   or --force-install-manual (override) is passed, then promoted onto PATH
#   via ~/.local/bin. See docs/adr/0027-manual-install-oneliner-is-executed-
#   only-under-explicit-flags.md.
#   See docs/adr/0010-install-recipes-keyed-by-package-manager.md.


# ---------------------------------------------------------------------------
# Platform
# ---------------------------------------------------------------------------

[platform]
# Ranked preference across install methods. Managers declared below but absent
# here rank last, in catalogue declaration order. Reorder this to taste — it is
# the one place a machine owner says "uv, never pip".
prefer = [
  "pacman", "apt", "dnf", "zypper", "apk", "brew", "port",
  "paru", "yay",
  "uv", "pipx", "cargo", "go", "npm", "gem", "dotnet", "pip",
]

# binary  what must be on PATH for this manager to be usable
# os      optional constraint; matches sys.platform ("linux", "darwin", "win32")
# sudo    recipe needs root; `reactor install` prefixes it
[platform.manager]
pacman = { binary = "pacman", os = "linux",  sudo = true }
apt    = { binary = "apt",    os = "linux",  sudo = true }
dnf    = { binary = "dnf",    os = "linux",  sudo = true }
zypper = { binary = "zypper", os = "linux",  sudo = true }
apk    = { binary = "apk",    os = "linux",  sudo = true }
brew   = { binary = "brew",   os = "darwin" }
port   = { binary = "port",   os = "darwin", sudo = true }
# AUR helpers. Ranked below pacman so an official-repo recipe always wins, and
# never given sudo — both refuse to run as root and escalate themselves.
paru   = { binary = "paru",   os = "linux" }
yay    = { binary = "yay",    os = "linux" }
uv     = { binary = "uv" }
pipx   = { binary = "pipx" }
# `dotnet tool install --global` drops binaries in ~/.dotnet/tools, which is not
# on PATH by default. A tool installed this way can therefore still probe as
# absent -- that is the shell's business, not a failed recipe.
dotnet = { binary = "dotnet" }
pip    = { binary = "pip3" }
cargo  = { binary = "cargo" }
go     = { binary = "go" }
npm    = { binary = "npm" }
gem    = { binary = "gem" }


# ---------------------------------------------------------------------------
# Probing
# ---------------------------------------------------------------------------

[probe]
# Seconds before a probe is abandoned. A timed-out probe reports UNKNOWN, never
# absent — see docs/adr/0006-registry-injected-into-system-prompt.md.
timeout = 5.0
# Detection results (is the binary here at all) are cached this long. Installing
# a tool mid-session is rare; `reactor refresh` forces a re-probe.
detect_ttl = 300
# Service results (is it running, what is attached) change during a session, so
# they expire fast.
service_ttl = 30
# Interpreter used for python_module detection.
python = "python3"


# ---------------------------------------------------------------------------
# Static analysis — native
# ---------------------------------------------------------------------------

[tool.bn]
name   = "Binary Ninja"
desc   = "reverse engineering framework; drives a live BN session"
source  = "https://github.com/w1sent/bn-plugins"
invoke = "bn"
detect = { binary = "bn" }
tags   = ["static", "native", "disassembler", "decompiler"]
service = { probe = ["bn", "health"], label = "BN session" }
skill = { source = "git+https://github.com/w1sent/bn-plugins", path = "ai/mcp-server/skills/binja-cli", ref = "main" }

[tool.bn.install]
manual = "install the binja-mcp plugin from the bn-plugins repo, then run its scripts/install.py"

[tool.bindiff]
name    = "BinDiff"
desc    = "diff two binaries' disassembly headlessly: matched functions, similarity"
source  = "https://github.com/google/bindiff"
invoke  = "bindiff --primary=a.BinExport --secondary=b.BinExport --output_dir=."
detect  = { binary = "bindiff" }
version = ["bindiff", "--version"]
# No `skill = {...}`: BinDiff's own docs cover its CLI flags and the IDA/GUI
# workflow, but not this catalogue's actual pipeline -- exporting from `bn`
# via script rather than IDA, and reading the resulting .BinDiff SQLite file
# programmatically -- so a REactor-authored skill covers that gap
# (ADR-0008 case 3). See skills/bindiff/.
tags    = ["static", "native"]

[tool.bindiff.install]
# Not in any distro's own repos, official or AUR. Upstream's last prebuilt
# release (.deb/.dmg/.msi, v8) shipped in 2023 and nothing has followed --
# building from source is the only currently-maintained path. `bn` is this
# catalogue's disassembler (ADR: bn over IDA), so -DBINEXPORT_ENABLE_IDAPRO=OFF
# and skipping the Java GUI (needs the commercial yFiles library, irrelevant
# to the headless CLI) both apply.
manual = "build from source -- git clone https://github.com/google/bindiff && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBINEXPORT_ENABLE_IDAPRO=OFF && cmake --build build && cmake --install build (needs CMake 3.14+, Ninja, a C++ compiler, and Git)"
# The same build, into the user-local prefix instead of /usr/local (ADR-0027).
manual-install-oneliner = 'git clone https://github.com/google/bindiff && cd bindiff && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBINEXPORT_ENABLE_IDAPRO=OFF && cmake --build build && cmake --install build --prefix "$HOME/.local"'

[tool.vxsig]
name   = "VxSig"
desc   = "generate AV signatures (YARA) from sets of pairwise-diffed binaries"
source = "https://github.com/google/vxsig"
invoke = "vxsig --detection_name=NAME diff1.BinDiff [diff2.BinDiff ...]"
detect = { binary = "vxsig" }
# No `version` entry: `vxsig --version` prints only the bare string "vxsig",
# no actual version number, so there is nothing useful to show.
tags   = ["static", "malware"]

[tool.vxsig.install]
# No releases and not packaged anywhere -- Bazel build from source is the
# only path. Built and verified in this catalogue's own dev environment, and
# independently reproduced on a second machine: vxsig has nothing to do with
# Android, but on a machine where ANDROID_HOME/ANDROID_SDK_ROOT disagree (any
# box with Android tooling installed is a candidate), Bazel's rules_android
# module misfires trying to auto-configure a toolchain from it and the build
# never reaches vxsig's own code at all -- hence the env -u prefix below on
# every run, not just as a fallback. Binary lands at bazel-bin/vxsig/vxsig;
# run its example against vxsig/testdata/*.BinDiff to confirm before install.
manual = "git clone https://github.com/google/vxsig && cd vxsig && env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME bazelisk build -c opt //vxsig:vxsig && sudo install -Dm755 bazel-bin/vxsig/vxsig /usr/local/bin/vxsig"
# Same build, into the user-local prefix -- no sudo (ADR-0027).
manual-install-oneliner = 'git clone https://github.com/google/vxsig && cd vxsig && env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME bazelisk build -c opt //vxsig:vxsig && install -Dm755 bazel-bin/vxsig/vxsig "$HOME/.local/bin/vxsig"'

[tool.lief]
name   = "LIEF"
desc   = "parse and modify ELF/PE/Mach-O from python"
source = "https://github.com/lief-project/LIEF"
invoke = "python3 -c 'import lief'"
detect = { python_module = "lief" }
tags   = ["static", "native", "parsing", "python"]

[tool.lief.install]
uv  = "uv pip install lief"
pip = "pip install lief"

[tool.joern]
name   = "Joern"
desc   = "code property graph; dataflow and reachability queries over source"
source = "https://github.com/joernio/joern"
invoke = "joern"
detect = { binary = "joern" }
tags   = ["static", "source", "dataflow"]

[tool.joern.install]
manual = "https://joern.io/ — download and add to PATH"

[tool.angr]
name   = "angr"
desc   = "binary analysis and symbolic execution from python"
source = "https://github.com/angr/angr"
invoke = "python3 -c 'import angr'"
detect = { python_module = "angr" }
tags   = ["static", "native", "symbolic", "solving", "python"]

[tool.angr.install]
uv  = "uv pip install angr"
pip = "pip install angr"


# ---------------------------------------------------------------------------
# Static analysis — managed runtimes
# ---------------------------------------------------------------------------

[tool.jadx]
name    = "jadx"
desc    = "decompile Android DEX/APK to Java"
source  = "https://github.com/skylot/jadx"
invoke  = "jadx"
detect  = { binary = "jadx" }
version = ["jadx", "--version"]
tags    = ["static", "managed", "android", "decompiler"]

[tool.jadx.install]
pacman = "pacman -S jadx"
brew   = "brew install jadx"
# No apt recipe: jadx is in neither Debian nor Ubuntu, at any suite. Debian
# users take the release zip.
manual = "https://github.com/skylot/jadx/releases"

[tool.ilspycmd]
name    = "ilspycmd"
desc    = "decompile .NET assemblies to C#; ILSpy's command-line form"
source  = "https://github.com/icsharpcode/ILSpy"
invoke  = "ilspycmd"
detect  = { binary = "ilspycmd" }
version = ["ilspycmd", "--version"]
tags    = ["static", "managed", "dotnet", "decompiler"]

[tool.ilspycmd.install]
dotnet = "dotnet tool install --global ilspycmd"

[tool.decompile-python]
name   = "decompile .pyc"
desc   = "decompile compiled Python bytecode (.pyc): dis+marshal, then lift to source"
source = "https://docs.python.org/3/library/dis.html"
invoke = "python3 -m dis <file.pyc>"
detect = { binary = "python3" }
# No `skill = {...}` here on purpose: this tool has no upstream to fetch a
# skill from -- the technique itself, not any single binary, is the tool, and
# the REactor-authored skill that teaches it ships unconditionally under
# skills/decompile-python/ (same shape as skills/pi-subagent/, ADR-0008's
# third preference: no upstream, no --help worth reading, so a written skill
# is where the value actually is). `requires: [decompile-python]` in its
# frontmatter documents the link back to this entry.
tags   = ["static", "managed", "python", "decompiler"]

[tool.decompile-python.install]
pacman = "pacman -S python"
apt    = "apt install python3"
brew   = "brew install python3"
dnf    = "dnf install python3"
# Not a fallback for a missing recipe -- python3 above almost always resolves,
# since reactor itself needs it. This is the actual point: one interpreter
# decompiles nothing outside its own bytecode version, and there is no way to
# know which version a given .pyc needs ahead of time.
manual = "for version-matching against arbitrary .pyc files, install every version your distro ships: `reactor install 'decompile-python[all]'` (the platform's own repos only, never the AUR)"


# ---------------------------------------------------------------------------
# Static analysis — malware triage
# ---------------------------------------------------------------------------

[tool.oletools]
name   = "oletools"
desc   = "extract and scan macros/streams in Office documents for malware"
source = "https://github.com/decalage2/oletools"
invoke = "olevba"
detect = { binary = "olevba" }
tags   = ["static", "triage", "malware", "python"]

[tool.oletools.install]
uv   = "uv pip install oletools"
pip  = "pip install oletools"
# Arch's own repos have nothing; the AUR package is named for its upstream
# import name rather than the PyPI one.
paru = "paru -S python-oletools"
yay  = "yay -S python-oletools"
# Fedora packages it under the same import-name convention.
dnf  = "dnf install python3-oletools"

[tool.flare-floss]
name    = "FLOSS"
desc    = "extract obfuscated strings from malware: stack, decoded, tight-loop"
source  = "https://github.com/mandiant/flare-floss"
invoke  = "floss"
detect  = { binary = "floss" }
version = ["floss", "--version"]
tags    = ["static", "triage", "malware", "python"]

[tool.flare-floss.install]
uv   = "uv tool install flare-floss"
pipx = "pipx install flare-floss"

[tool.capa]
name    = "capa"
desc    = "detect capabilities in executable files via rule-based matching"
source  = "https://github.com/mandiant/capa"
invoke  = "capa"
detect  = { binary = "capa" }
version = ["capa", "--version"]
tags    = ["static", "triage", "malware"]

[tool.capa.install]
# PyPI's bare `capa` is an unrelated, unaffiliated package -- this one is
# published under the FLARE team's own prefix.
uv   = "uv tool install flare-capa"
pipx = "pipx install flare-capa"


# ---------------------------------------------------------------------------
# Dynamic instrumentation
# ---------------------------------------------------------------------------

[tool.frida]
name    = "frida"
desc    = "dynamic instrumentation; hook and trace running processes"
source  = "https://github.com/frida/frida"
invoke  = "frida"
detect  = { binary = "frida" }
version = ["frida", "--version"]
tags    = ["dynamic", "instrumentation", "mobile"]

[tool.frida.install]
# No homebrew-core formula or cask exists; pip is the upstream-supported route
# on macOS as well.
uv   = "uv tool install frida-tools"
pipx = "pipx install frida-tools"

[tool.objection]
name   = "objection"
desc   = "runtime mobile exploration built on frida"
source = "https://github.com/sensepost/objection"
invoke = "objection"
detect = { binary = "objection" }
tags   = ["dynamic", "mobile", "android", "ios"]

[tool.objection.install]
uv   = "uv tool install objection"
pipx = "pipx install objection"


# ---------------------------------------------------------------------------
# Debugging
# ---------------------------------------------------------------------------

[tool.gdb]
name    = "GDB"
desc    = "native debugger"
source  = "https://sourceware.org/gdb/"
invoke  = "gdb"
detect  = { binary = "gdb" }
version = ["gdb", "--version"]
tags    = ["dynamic", "debugger"]

[tool.gdb.install]
pacman = "pacman -S gdb"
apt    = "apt install gdb"
dnf    = "dnf install gdb"

[tool.lldb]
name    = "LLDB"
desc    = "native debugger; scriptable with `lldb --batch -o <command>`"
source  = "https://lldb.llvm.org/"
invoke  = "lldb"
detect  = { binary = "lldb" }
# Tagged exactly as gdb is. "native" would be true but it is a *static*
# analysis tag here -- [toolset.native] means compiled-binary static analysis,
# and a debugger in that set is the union bug wearing a different hat.
version = ["lldb", "--version"]
tags    = ["dynamic", "debugger"]

[tool.lldb.install]
pacman = "pacman -S lldb"
apt    = "apt install lldb"
dnf    = "dnf install lldb"
# macOS: ships with the Xcode command line tools; the llvm formula is a
# second copy and usually the wrong one to reach for.
brew   = "brew install llvm"
manual = "macOS: xcode-select --install"

[tool.rr]
name   = "rr"
desc   = "record and deterministically replay execution; reverse debugging"
source = "https://github.com/rr-debugger/rr"
invoke = "rr"
detect = { binary = "rr" }
tags   = ["dynamic", "debugger", "record-replay"]

[tool.rr.install]
apt  = "apt install rr"
# Not in the official Arch repos; AUR only.
paru = "paru -S rr"
yay  = "yay -S rr"


# ---------------------------------------------------------------------------
# Mobile
# ---------------------------------------------------------------------------

[tool.adb]
name    = "adb"
desc    = "Android device bridge; shell, install, pull, forward"
source  = "https://developer.android.com/tools/adb"
invoke  = "adb"
detect  = { binary = "adb" }
tags    = ["mobile", "android", "device"]
service = { probe = ["adb", "devices"], label = "adb", count = { pattern = '\sdevice$', noun = "device" } }

[tool.adb.install]
pacman = "pacman -S android-tools"
apt    = "apt install adb"
# A cask, not a formula. `brew install` would dispatch to it anyway; explicit
# so the recipe cannot be misread as a formula that went missing.
brew   = "brew install --cask android-platform-tools"

[tool.apktool]
name   = "apktool"
desc   = "unpack and repack APK resources and smali"
source = "https://github.com/iBotPeaches/Apktool"
invoke = "apktool"
detect = { binary = "apktool" }
tags   = ["mobile", "android", "unpacking"]

[tool.apktool.install]
apt  = "apt install apktool"
brew = "brew install apktool"
# AUR only, and named android-apktool there rather than apktool.
paru = "paru -S android-apktool"
yay  = "yay -S android-apktool"

[tool.aapt2]
name    = "aapt2"
desc    = "inspect APK manifests, resources and the resource table"
source  = "https://developer.android.com/tools/aapt2"
invoke  = "aapt2"
detect  = { binary = "aapt2" }
# `aapt2 version`, not `--version`: the flag form prints "unknown option" and
# still exits 0, so it would put that string in the registry as the version.
version = ["aapt2", "version"]
tags    = ["mobile", "android", "parsing"]

[tool.aapt2.install]
# Not a typo: Debian's `aapt` package ships /usr/bin/aapt2 alongside /usr/bin/
# aapt, and unlike the separate `aapt2` package it also exists on Ubuntu.
apt    = "apt install aapt"
paru   = "paru -S android-sdk-build-tools"
yay    = "yay -S android-sdk-build-tools"
manual = "part of the Android SDK build-tools; `sdkmanager 'build-tools;35.0.0'`"

[tool.ipsw]
name   = "ipsw"
desc   = "iOS/macOS firmware and dyld_shared_cache tooling"
source = "https://github.com/blacktop/ipsw"
invoke = "ipsw"
detect = { binary = "ipsw" }
tags   = ["mobile", "ios", "firmware", "macho"]
skill = { source = "git+https://github.com/blacktop/ipsw-skill", path = "ipsw", ref = "main" }

[tool.ipsw.install]
# Promoted into homebrew-core, so no tap to add. blacktop/tap/ipsw still exists
# and tracks upstream more closely if core lags.
brew   = "brew install ipsw"
manual = "https://github.com/blacktop/ipsw/releases"

[tool.mobilecli]
name   = "mobilecli"
desc   = "drive Android and iOS devices; screenshot, tap, launch"
source = "https://github.com/mobile-next/mobilecli"
invoke = "mobilecli"
detect = { binary = "mobilecli" }
tags   = ["mobile", "android", "ios", "device"]

[tool.mobilecli.install]
npm = "npm install -g mobilecli"


