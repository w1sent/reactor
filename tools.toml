desc    = "network security monitor: deep packet inspection and protocol logging"
invoke  = "zeek"
detect  = { binary = "zeek" }
version = ["zeek", "--version"]
tags    = ["network", "pcap"]

[tool.zeek.install]
brew   = "brew install zeek"
# Not in Debian/Ubuntu's own archives (only Debian's debports, which most
# machines do not have enabled) and not in Fedora either -- upstream ships
# its own repo per distro instead.
paru   = "paru -S zeek"
yay    = "yay -S zeek"
manual = "https://zeek.org/get-zeek/ — adds the right upstream repo for your distro"

[tool.scapy]
name   = "scapy"
desc   = "craft, send and dissect packets from python"
invoke = "python3 -c 'import scapy'"
detect = { python_module = "scapy" }
tags   = ["network", "python"]

[tool.scapy.install]
uv  = "uv pip install scapy"
pip = "pip install scapy"


