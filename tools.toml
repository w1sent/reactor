# ---------------------------------------------------------------------------
# Databases — clients for talking to running database servers
# ---------------------------------------------------------------------------

# No service probes here, deliberately: these are clients, and the thing they
# talk to is usually a remote server with credentials of its own, not a
# well-defined local default. `redis-cli ping`, `mongosh --eval ...` and
# `influx ping` are one command away whenever the agent needs the answer, and
# an auth wall would make a live server read as down.

[tool.usql]
name   = "usql"
desc   = "universal SQL client: PostgreSQL, MySQL, SQLite, SQL Server, Oracle, and more"
source  = "https://github.com/xo/usql"
invoke = 'usql <dsn> -c "<sql>"'
detect = { binary = "usql" }
version = ["usql", "--version"]
tags   = ["database"]

[tool.usql.install]
# Not in Debian/Ubuntu or Fedora. Upstream also supports `go install`, but a
# plain `go install github.com/xo/usql@latest` builds only the base drivers
# (PostgreSQL, MySQL, SQLite3, SQL Server, Oracle); release, AUR and tap
# builds carry the `most` tag, so the go route stays a note, never a recipe.
brew = "brew install xo/xo/usql"
paru = "paru -S usql"
yay  = "yay -S usql"
manual = "https://github.com/xo/usql/releases — or `go install -tags most github.com/xo/usql@latest`"
# Assumes the default GOBIN (~/.local/bin on go >= 1.25, else ~/go/bin); the
# symlink lands there either way, which is the promotion step's whole job.
manual-install-oneliner = 'go install -tags most github.com/xo/usql@latest && ln -sf "$(go env GOPATH)/bin/usql" "$HOME/.local/bin/usql"'

[tool.mongosh]
name    = "mongosh"
desc    = "MongoDB shell: query and inspect MongoDB databases"
source  = "https://github.com/mongodb-js/mongosh"
invoke  = 'mongosh <uri> --eval "<js>"'
detect  = { binary = "mongosh" }
version = ["mongosh", "--version"]
tags    = ["database"]

[tool.mongosh.install]
# Upstream's apt/dnf packages live only in MongoDB's own repositories, which
# have to be added first -- so those routes are the manual note, not recipes.
npm  = "npm install -g mongosh"
brew = "brew install mongosh"
# mongosh-bin is the standalone shell in the AUR; there is no mongodb-mongosh.
paru = "paru -S mongosh-bin"
yay  = "yay -S mongosh-bin"
manual = "https://www.mongodb.com/try/download/shell — upstream's own apt/dnf repositories (add the repo first)"

[tool.redis-cli]
name    = "redis-cli"
desc    = "Redis CLI: query, inspect and script Redis servers"
source  = "https://github.com/redis/redis"
invoke  = "redis-cli"
detect  = { binary = "redis-cli" }
version = ["redis-cli", "--version"]
tags    = ["database"]

[tool.redis-cli.install]
# No pacman recipe: Arch's official repos replaced redis with valkey, whose
# client is valkey-cli; the AUR has a standalone redis-cli build. No dnf
# recipe for the same reason -- Fedora also ships valkey.
apt  = "apt install redis-tools"
brew = "brew install redis"
paru = "paru -S redis-cli"
yay  = "yay -S redis-cli"
manual = "build from https://github.com/redis/redis (`make redis-cli`) — or valkey-cli, its wire-compatible fork client"
# A redis-cli build needs nothing but a C compiler: only the client target.
manual-install-oneliner = 'git clone https://github.com/redis/redis && cd redis && make redis-cli && install -Dm755 src/redis-cli "$HOME/.local/bin/redis-cli"'

[tool.cqlsh]
name    = "cqlsh"
desc    = "Cassandra CQL shell: query and inspect Cassandra clusters"
source  = "https://github.com/apache/cassandra"
invoke  = 'cqlsh -e "<cql>" <host>'
detect  = { binary = "cqlsh" }
version = ["cqlsh", "--version"]
tags    = ["database"]

[tool.cqlsh.install]
# The PyPI package is a community packaging of cqlsh (jeffwidman/cqlsh), not
# the Apache project's own -- its source is apache/cassandra, which ships
# cqlsh in the distribution and does not publish it to PyPI itself. No server.
uv  = "uv pip install cqlsh"
pip = "pip install cqlsh"
# Every other path is the full Cassandra distribution; cqlsh ships inside it
# and is not packaged on its own.
brew = "brew install cassandra"
paru = "paru -S cassandra"
yay  = "yay -S cassandra"
manual = "ships with Cassandra itself — https://cassandra.apache.org/"

[tool.influx]
name    = "Influx CLI"
desc    = "InfluxDB CLI: query, write and manage InfluxDB instances"
source  = "https://github.com/influxdata/influx-cli"
invoke  = "influx"
detect  = { binary = "influx" }
# `version`, not `--version`: the subcommand is the documented probe.
version = ["influx", "version"]
tags    = ["database"]

[tool.influx.install]
# The brew formula is influxdb-cli, renamed from influx-cli. No pacman recipe:
# Arch's influxdb package ships only the influxd server binary, not the CLI,
# and there is no AUR package for the CLI either.
brew = "brew install influxdb-cli"
manual = "https://github.com/influxdata/influx-cli/releases — apt/dnf packages live in InfluxData's own repositories (add the repo first)"
# Upstream's GitHub releases carry no binary assets; the version-pinned
# tarballs live on InfluxData's portal, so the oneliner resolves the latest
# tag via the (asset-less) GitHub API and builds the portal URL from it.
manual-install-oneliner = 'v=$(curl -fsSL https://api.github.com/repos/influxdata/influx-cli/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)[\"tag_name\"].lstrip(\"v\"))") && cd "$(mktemp -d)" && curl -fsSL "https://dl.influxdata.com/influxdb/releases/influxdb2-client-$v-linux-$(case $(uname -m) in x86_64) echo amd64;; aarch64) echo arm64;; esac).tar.gz" | tar -xz && install -Dm755 influx "$HOME/.local/bin/influx"'


