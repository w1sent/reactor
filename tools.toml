debian = "apt install rr"


# ---------------------------------------------------------------------------
# Mobile
# ---------------------------------------------------------------------------

[tool.adb]
name    = "adb"
desc    = "Android device bridge; shell, install, pull, forward"
invoke  = "adb"
detect  = { binary = "adb" }
tags    = ["mobile", "android", "device"]
service = { probe = ["adb", "devices"], label = "devices" }

[tool.adb.install]
arch   = "pacman -S android-tools"
debian = "apt install adb"
macos  = "brew install android-platform-tools"

[tool.apktool]
name   = "apktool"
desc   = "unpack and repack APK resources and smali"
invoke = "apktool"
detect = { binary = "apktool" }
tags   = ["mobile", "android", "unpacking"]

[tool.apktool.install]
arch   = "pacman -S apktool"
debian = "apt install apktool"
macos  = "brew install apktool"

[tool.ipsw]
name   = "ipsw"
desc   = "iOS/macOS firmware and dyld_shared_cache tooling"
invoke = "ipsw"
detect = { binary = "ipsw" }
tags   = ["mobile", "ios", "firmware", "macho"]
skill = { source = "git+https://github.com/blacktop/ipsw-skill", ref = "main" }

[tool.ipsw.install]
macos = "brew install blacktop/tap/ipsw"
linux = "https://github.com/blacktop/ipsw/releases"

[tool.mobilecli]
