# ---------------------------------------------------------------------------
# Debugging
# ---------------------------------------------------------------------------

[tool.gdb]
name    = "GDB"
desc    = "native debugger"
invoke  = "gdb"
detect  = { binary = "gdb" }
version = ["gdb", "--version"]
tags    = ["dynamic", "debugger"]

[tool.gdb.install]
pacman = "pacman -S gdb"
apt    = "apt install gdb"
dnf    = "dnf install gdb"

[tool.lldb]
name    = "LLDB"
desc    = "native debugger; scriptable with `lldb --batch -o <command>`"
invoke  = "lldb"
detect  = { binary = "lldb" }
# Tagged exactly as gdb is. "native" would be true but it is a *static*
# analysis tag here -- [toolset.native] means compiled-binary static analysis,
# and a debugger in that set is the union bug wearing a different hat.
version = ["lldb", "--version"]
tags    = ["dynamic", "debugger"]

[tool.lldb.install]
pacman = "pacman -S lldb"
apt    = "apt install lldb"
dnf    = "dnf install lldb"
# macOS: ships with the Xcode command line tools; the llvm formula is a
# second copy and usually the wrong one to reach for.
brew   = "brew install llvm"
manual = "macOS: xcode-select --install"

[tool.rr]
name   = "rr"
desc   = "record and deterministically replay execution; reverse debugging"
invoke = "rr"
detect = { binary = "rr" }
tags   = ["dynamic", "debugger", "record-replay"]

[tool.rr.install]
apt  = "apt install rr"
# Not in the official Arch repos; AUR only.
paru = "paru -S rr"
yay  = "yay -S rr"


# ---------------------------------------------------------------------------
# Mobile
# ---------------------------------------------------------------------------

[tool.adb]
name    = "adb"
desc    = "Android device bridge; shell, install, pull, forward"
invoke  = "adb"
detect  = { binary = "adb" }
tags    = ["mobile", "android", "device"]
service = { probe = ["adb", "devices"], label = "adb", count = { pattern = '\sdevice$', noun = "device" } }

[tool.adb.install]
pacman = "pacman -S android-tools"
apt    = "apt install adb"
# A cask, not a formula. `brew install` would dispatch to it anyway; explicit
# so the recipe cannot be misread as a formula that went missing.
brew   = "brew install --cask android-platform-tools"

[tool.apktool]
name   = "apktool"
desc   = "unpack and repack APK resources and smali"
invoke = "apktool"
detect = { binary = "apktool" }
tags   = ["mobile", "android", "unpacking"]

[tool.apktool.install]
apt  = "apt install apktool"
brew = "brew install apktool"
# AUR only, and named android-apktool there rather than apktool.
paru = "paru -S android-apktool"
yay  = "yay -S android-apktool"

[tool.aapt2]
name    = "aapt2"
desc    = "inspect APK manifests, resources and the resource table"
invoke  = "aapt2"
detect  = { binary = "aapt2" }
# `aapt2 version`, not `--version`: the flag form prints "unknown option" and
# still exits 0, so it would put that string in the registry as the version.
version = ["aapt2", "version"]
tags    = ["mobile", "android", "parsing"]

[tool.aapt2.install]
# Not a typo: Debian's `aapt` package ships /usr/bin/aapt2 alongside /usr/bin/
# aapt, and unlike the separate `aapt2` package it also exists on Ubuntu.
apt    = "apt install aapt"
paru   = "paru -S android-sdk-build-tools"
yay    = "yay -S android-sdk-build-tools"
manual = "part of the Android SDK build-tools; `sdkmanager 'build-tools;35.0.0'`"

[tool.ipsw]
name   = "ipsw"
desc   = "iOS/macOS firmware and dyld_shared_cache tooling"
invoke = "ipsw"
detect = { binary = "ipsw" }
tags   = ["mobile", "ios", "firmware", "macho"]
skill = { source = "git+https://github.com/blacktop/ipsw-skill", path = "ipsw", ref = "main" }

[tool.ipsw.install]
# Promoted into homebrew-core, so no tap to add. blacktop/tap/ipsw still exists
# and tracks upstream more closely if core lags.
brew   = "brew install ipsw"
manual = "https://github.com/blacktop/ipsw/releases"

[tool.mobilecli]
name   = "mobilecli"
desc   = "drive Android and iOS devices; screenshot, tap, launch"
invoke = "mobilecli"
detect = { binary = "mobilecli" }
tags   = ["mobile", "android", "ios", "device"]

[tool.mobilecli.install]
npm = "npm install -g mobilecli"


