tags   = ["triage", "pattern-matching"]

[tool.ssdeep.install]
pacman = "pacman -S ssdeep"
apt    = "apt install ssdeep"
brew   = "brew install ssdeep"
dnf    = "dnf install ssdeep"


# ---------------------------------------------------------------------------
# Forensics — disk, memory, timeline, and metadata
# ---------------------------------------------------------------------------

[tool.exiftool]
name    = "ExifTool"
desc    = "read and write image/document/media metadata (EXIF, IPTC, XMP, and more)"
source  = "https://exiftool.org/"
invoke  = "exiftool"
detect  = { binary = "exiftool" }
version = ["exiftool", "-ver"]
tags    = ["forensics", "triage"]

[tool.exiftool.install]
# Packaged under its Perl distribution name everywhere except brew.
pacman = "pacman -S perl-image-exiftool"
apt    = "apt install libimage-exiftool-perl"
brew   = "brew install exiftool"
dnf    = "dnf install perl-Image-ExifTool"

[tool.sleuthkit]
name    = "The Sleuth Kit"
desc    = "analyze disk images and filesystems: fls, icat, mmls, and more"
source  = "https://github.com/sleuthkit/sleuthkit"
invoke  = "fls"
detect  = { binary = "fls" }
version = ["fls", "-V"]
tags    = ["forensics", "disk"]

[tool.sleuthkit.install]
pacman = "pacman -S sleuthkit"
apt    = "apt install sleuthkit"
brew   = "brew install sleuthkit"
dnf    = "dnf install sleuthkit"

[tool.foremost]
name   = "Foremost"
desc   = "carve files from a disk image by header/footer signatures"
source = "https://sourceforge.net/projects/foremost/"
invoke = "foremost"
detect = { binary = "foremost" }
tags   = ["forensics", "disk", "carving"]

[tool.foremost.install]
pacman = "pacman -S foremost"
apt    = "apt install foremost"
brew   = "brew install foremost"
dnf    = "dnf install foremost"

[tool.photorec]
