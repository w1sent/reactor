detect  = { binary = "exiftool" }
version = ["exiftool", "-ver"]
tags    = ["forensics", "triage"]

[tool.exiftool.install]
# Packaged under its Perl distribution name everywhere except brew.
pacman = "pacman -S perl-image-exiftool"
apt    = "apt install libimage-exiftool-perl"
brew   = "brew install exiftool"
dnf    = "dnf install perl-Image-ExifTool"

[tool.sleuthkit]
name    = "The Sleuth Kit"
desc    = "analyze disk images and filesystems: fls, icat, mmls, and more"
invoke  = "fls"
detect  = { binary = "fls" }
version = ["fls", "-V"]
tags    = ["forensics", "disk"]

[tool.sleuthkit.install]
pacman = "pacman -S sleuthkit"
apt    = "apt install sleuthkit"
brew   = "brew install sleuthkit"
dnf    = "dnf install sleuthkit"

[tool.foremost]
name   = "Foremost"
desc   = "carve files from a disk image by header/footer signatures"
invoke = "foremost"
detect = { binary = "foremost" }
tags   = ["forensics", "disk", "carving"]

[tool.foremost.install]
pacman = "pacman -S foremost"
apt    = "apt install foremost"
brew   = "brew install foremost"
dnf    = "dnf install foremost"

[tool.photorec]
name   = "PhotoRec"
desc   = "recover deleted or lost files from disks via data carving"
invoke = "photorec"
detect = { binary = "photorec" }
tags   = ["forensics", "disk", "carving"]

[tool.photorec.install]
# photorec ships inside the testdisk package/repo everywhere it is packaged.
pacman = "pacman -S testdisk"
apt    = "apt install testdisk"
brew   = "brew install testdisk"
dnf    = "dnf install testdisk"

[tool.bulk-extractor]
name   = "bulk_extractor"
desc   = "scan disk images for emails, URLs, credit cards, and other features"
invoke = "bulk_extractor"
detect = { binary = "bulk_extractor" }
tags   = ["forensics", "disk", "carving"]

[tool.bulk-extractor.install]
brew   = "brew install bulk_extractor"
manual = "https://github.com/simsong/bulk_extractor — not packaged elsewhere; build from source (CMake) or take a release asset"

[tool.dissect]
name   = "dissect"
desc   = "parse disk images, filesystems, and artifacts from python"
invoke = "target-query"
detect = { binary = "target-query" }
tags   = ["forensics", "disk", "python"]

[tool.dissect.install]
# `dissect` on PyPI is the umbrella package that pulls in target-query,
# target-shell and every dissect.* format library; installed as an app, like
# frida-tools, because that is how its console scripts are meant to be used.
uv   = "uv tool install dissect"
pipx = "pipx install dissect"

[tool.mac-apt]
name   = "mac_apt"
desc   = "parse macOS/iOS forensic artifacts: plists, logs, databases, and more"
invoke = "python3 mac_apt.py"
detect = { binary = "mac_apt.py" }
tags   = ["forensics", "macos", "python"]

[tool.mac-apt.install]
# Not packaged anywhere, and not on PyPI either -- upstream's own install
# instructions are "clone it and pip install its requirements file".
manual = "git clone https://github.com/ydkhatri/mac_apt && pip install -r mac_apt/requirements.txt"

[tool.spotlight-parser]
name   = "spotlight_parser"
desc   = "parse macOS Spotlight store.db metadata databases"
invoke = "python3 spotlight_parser.py"
detect = { binary = "spotlight_parser.py" }
tags   = ["forensics", "macos", "python"]

[tool.spotlight-parser.install]
# A single stdlib-only script, not a package -- there is nothing for pip to
# install even if it were on PyPI.
manual = "git clone https://github.com/ydkhatri/spotlight_parser"

[tool.fseventsparser]
name   = "FSEventsParser"
desc   = "parse macOS FSEvents records: historical file-system activity"
invoke = "python3 FSEParser_V4.1.py"
# The upstream filename carries its own version (V4.1 at the time of
# writing) and has changed with past releases -- update this alongside a
# catalogue refresh if `reactor doctor` starts reporting it absent on a
# machine that has a newer clone.
detect = { binary = "FSEParser_V4.1.py" }
tags   = ["forensics", "macos", "python"]

[tool.fseventsparser.install]
# A single script; dfvfs is only needed for its optional "parse directly from
# a raw disk image" mode, not for parsing already-extracted fsevents files.
manual = "git clone https://github.com/dlcowen/FSEventsParser (optionally: pip install dfvfs, for parsing a raw disk image instead of an extracted fsevents directory)"

[tool.ileapp]
name   = "iLEAPP"
desc   = "parse iOS logs, events, and property lists into forensic reports"
invoke = "python3 ileapp.py"
detect = { binary = "ileapp.py" }
tags   = ["forensics", "ios", "python"]

[tool.ileapp.install]
