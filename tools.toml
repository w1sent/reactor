[tool.lnav]
name    = "lnav"
desc    = "log file viewer with SQL queries, timeline merging, and headless scripting"
source  = "https://github.com/tstack/lnav"
# -n: no curses UI (headless); -N: skip the default syslog file when none is
# named -- both matter for an agent, which has no terminal and should never
# end up tailing this machine's own syslog by accident.
invoke  = "lnav -n -N -c ';SELECT ...' <file>"
detect  = { binary = "lnav" }
version = ["lnav", "-V"]
# No `skill = {...}` here: lnav's own --help documents its flags, but not the
# headless SQL-query workflow, or that its two data paths -- a recognized
# format's real columns versus fields auto-discovered from unstructured text
# -- do not behave the same way under filtering and aggregation (verified;
# see the skill). That gap is what the REactor-authored skill under
# skills/lnav/ covers (ADR-0008 case 3).
tags    = ["general", "triage"]

[tool.lnav.install]
pacman = "pacman -S lnav"
apt    = "apt install lnav"
brew   = "brew install lnav"
dnf    = "dnf install lnav"


# ---------------------------------------------------------------------------
# Agent delegation
# ---------------------------------------------------------------------------

[tool.pi-subagent]
name    = "pi"
desc    = "spin up a fresh, scoped subagent; non-interactive only (-p), never bare"
source  = "https://github.com/earendil-works/pi"
# Multi-word invoke is a usage example, not a command name (see bin/reactor's
# _label()) -- and here the example is the point: bare `pi` wants a real
# terminal, which a Bash tool call does not have, so it hangs until the tool
# timeout kills it. -p is what pi's own --help calls "non-interactive mode:
# process prompt and exit" -- the one flag that both needs no TTY and exits
# when done. See ADR-0018 and ADR-0022 (catalogue id `pi-subagent`, not bare
# `pi`, once a skill needed a name of its own to bind to).
invoke  = 'pi -p "<prompt>"'
detect  = { binary = "pi" }
version = ["pi", "--version"]
tags    = ["agent"]

[tool.pi-subagent.install]
npm    = "npm install -g --ignore-scripts @earendil-works/pi-coding-agent"
manual = "https://pi.dev/docs — quickstart has the curl installer too"
