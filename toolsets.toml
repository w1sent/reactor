# REactor toolsets — SHIPPED COPY / SEED
#
# Copied to ~/.pi/reactor/toolsets.toml at install time; the installed copy is
# what is read at runtime and is where user-defined toolsets go. Same update
# rules as tools.toml: `reactor diff-config`, merge by hand.
# See docs/adr/0004-config-updates-via-plain-diff.md.
#
# A toolset is a named group of tools the user activates or deactivates as a
# unit. Activation shapes only what the agent is TOLD about — it never blocks
# anything. See docs/adr/0007-deactivation-is-soft.md.
#
# [toolset.<id>]
#   desc   One line, shown in the selector. Not injected into the prompt.
#   tools  Explicit tool ids.
#   tags   Tags from tools.toml. A tool is included when it carries *every* tag
#          listed — ["static", "native"] is "static AND native", not either.
#          See docs/adr/0013-toolset-tags-intersect.md. Members are the explicit
#          `tools` plus everything matching the whole tag list.
#   all    Every catalogue entry, whatever its tags. Only `all` uses this —
#          the catalogue is what defines this group, not any property its
#          members share, so an untagged tool still belongs to it.
#
# For "either of these", activate two toolsets: activation unions them, which is
# why the tag list does not. These sets are deliberately tight for that reason —
# they are meant to be combined, not to each be self-sufficient.
#
# Prefer `tags` over `tools`. A tag list keeps working when the catalogue grows;
# a name list has to be remembered in two files. Where both appear below, the
# named tool is one that genuinely does not carry the tag — frida is not an
# Android tool, it is an everything tool that Android work happens to need.

version = 1

[toolset.all]
desc = "everything in the catalogue"
all  = true

[toolset.triage]
desc  = "first look: what is this file, and what is inside it"
tags  = ["triage"]
tools = ["lief", "ripgrep", "jq"]

[toolset.native]
desc = "static analysis of compiled binaries"
# Every native tool here is also a static one, so "static" would narrow nothing
# and is left off. It would be correct now — tags intersect — but a tag that
# changes no member is a claim nobody checks.
tags = ["native"]

[toolset.managed]
desc = "decompilation of managed bytecode: JVM/DEX and .NET"
tags = ["managed"]

[toolset.source]
desc  = "source-level analysis: query, parse, search"
tags  = ["source"]
tools = ["ripgrep"]

[toolset.solving]
desc = "symbolic execution and constraint solving"
tags = ["solving"]

[toolset.dynamic]
desc = "running-process instrumentation and debugging"
tags = ["dynamic"]

[toolset.debugging]
desc = "debuggers only — no instrumentation frameworks"
tags = ["debugger"]

[toolset.android]
desc  = "Android application analysis"
# frida is tagged `mobile`, not `android`: it is not an Android tool, it is a
# general one that Android work reaches for. Naming it here says exactly that.
tags  = ["android"]
tools = ["frida"]

[toolset.ios]
desc  = "iOS application and firmware analysis"
tags  = ["ios"]
tools = ["frida"]

[toolset.firmware]
desc  = "firmware and embedded images: identify, carve, inspect"
tags  = ["firmware"]
tools = ["lief", "yara"]

[toolset.network]
desc = "traffic capture and packet work"
tags = ["network"]

[toolset.general]
desc = "search and JSON — worth adding back to any narrow set"
tags = ["general"]

[toolset.agent]
desc = "delegate work to another agent — subagents, one-shot tasks"
tags = ["agent"]
